# 服务端口
sp.doc=9999
sp.gateway=10001
sp.login=10200
sp.auth=10400

# 服务名称
sn.doc=DOC
sn.gateway=GATEWAY
sn.login=LOGIN
sn.auth=OAUTH2
# 注意：后续新增服务模块的（服务端口、服务名称），都在nacos配置中心的system.yaml添加，不修改此配置文件 ###############

# 环境选择配置切换
spring.profiles.active=dev

# Nacos服务发现配置，参考地址：https://github.com/alibaba/spring-cloud-alibaba/wiki/Nacos-discovery
# 指定 Nacos 服务中心主机和端口
spring.cloud.nacos.discovery.server-addr=${nacos.addr}
# 指定 namespace，默认为 public
spring.cloud.nacos.discovery.namespace=${nacos.namespace}

# Nacos配置中心配置，参考地址：https://github.com/alibaba/spring-cloud-alibaba/wiki/Nacos-config
# 指定 Nacos 配置中心主机和端口
spring.cloud.nacos.config.server-addr=${nacos.addr}
# 指定 namespace，默认为 public
spring.cloud.nacos.config.namespace=${nacos.namespace}
# 配置文件前缀,默认为spring.application.name的值
spring.cloud.nacos.config.prefix=project
# 配置文件扩展名,目前只支持properties和yaml类型
spring.cloud.nacos.config.file-extension=yaml

# 服务器启动时需要立即加载共享的配置，省略扩展名
spring.cloud.nacos.config.extension-configs[0].data-id=system.yaml
spring.cloud.nacos.config.extension-configs[1].data-id=data-source.yaml
spring.cloud.nacos.config.extension-configs[2].data-id=third-services.yaml
spring.cloud.nacos.config.extension-configs[3].data-id=key-config.yaml
spring.cloud.nacos.config.extension-configs[0].refresh=true
spring.cloud.nacos.config.extension-configs[1].refresh=true
spring.cloud.nacos.config.extension-configs[2].refresh=true
spring.cloud.nacos.config.extension-configs[3].refresh=true
