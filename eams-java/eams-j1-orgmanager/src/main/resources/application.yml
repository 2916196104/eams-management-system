spring:
  application:
    name: eams-j1-orgmanager
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

server:
  port: 8082

knife4j:
  enable: true
  production: false
  setting:
    language: zh_cn
    enable-version: true
  openapi:
    title: 零壹教务管理系统-机构管理接口文档
    description: 组织页面-机构名称树、列表查询、详情、保存、删除接口
    version: 1.0.0
    group:
      default:
        api-rule: package
        api-rule-resources: com.zeroone.star.controller