server:
  port: ${sp.doc}
spring:
  application:
    name: ${sn.doc}
knife4j:
  enableAggregation: true
  nacos:
    enable: true
    serviceUrl: http://${nacos.addr}/${nacos.contextPath}
    routes:
      - name: 登录服务
        serviceName: ${sn.login}
        namespaceId: ${nacos.namespace}
        location: /v2/api-docs?group=login
      - name: 控制台模块
        serviceName: ${sn.login}
        namespaceId: ${nacos.namespace}
        location: /v2/api-docs?group=console
