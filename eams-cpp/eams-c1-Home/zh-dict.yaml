  # discount_amount: 优惠金额
  # arrearage: 欠费金额
  # remaining_amount: 剩余金额
  # should_refund_amount: 应退金额
  # refund_amount: 实际退款金额
  # refund_lesson_count: 退款课次
  # count_lesson_refund: 已退课次
  # unit_price: 课时单价
  # refund_remark: 退款备注
  # refund_state: 退款状态
  # school_name: 所属校区
  # plan_receipt: 计划收款
  # actual_receipt: 实际收款
  # ---RegistrationRecodeController
  query-records:
    summary: 获取报名课程列表（条件+分页）