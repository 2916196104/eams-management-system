redeemcredit:
  tag: 积分兑换
  summary: 兑换礼品
  request-success: 兑换成功
  field:
    credit_id: 要兑换的礼品的id
    student_id: 学生id
    school_id: 学校id
    redeem_count: 兑换数量
    stock_count: 库存数量
  request-failure:
    failure1: 该礼品不可兑换
    failure2: 礼品数量不足
    failure3: 积分不足
  remark: 兑换礼品
  reason: 积分商城兑换礼品
  num: 数量
LessonComment:
  tag: 点评记录
  query-all:
    summary: 获取点评记录（条件+分页）
  field:
    id: 主键ID
    lesson_id: 课程id
    class_id: 班级id,为空表示调课生
    student_id: 学员id
    dec_lesson_count: 实扣课次
    lesson_count: 应扣课次
    teacher_id: 点名的老师
    sign_time: 签到时间
    sign_type: 签到方式
    sign_state: 签到结果
    score: 老师评分
    evaluation: 老师评语
    evaluate_time: 评语时间
    evaluate_teacher: 评语老师
    evaluate_teacher_id: 评语老师id
    consume_course_id: 实际消费课程
    consume_student_course_id: 消费课程与学生关联表ID
    counselor: 学生的顾问
    add_time: 加入时间
    org_id: 上课老师所属组织ID  
EnrollCourse:
  tag: 报名记录
  query-all:
    summary: 获取报名的课程（条件+分页）
  field:
    id: 主键ID
    student_id: 学生id
    course_id: 课程id
    course_name: 课程名称
    subject_id: 科目id
    subject_name: 科目名称
    start_date: 开始时间
    expire_date: 过期日期
    remark: 备注
    count_lesson_total: 购买总课次
    count_lesson_complete: 已上课次
    count_lesson_refund: 退款次数
    course_amount: 套餐金额
    discount_amount: 优惠金额
    amount: 成交/合约金额
    paid_amount: 实付金额
    pay_off: 是否付清 0 否1是
    operater: 经手人
    creator: 创建人
    add_time: 录入时间
    editor: 编辑人
    edit_time: 编辑时间
    deleted: 删除标记
    verify_state: 审核状态
    warning_times: 不足时已提醒次数
    priority: 消课优先级
    unit_price: 单价
    from_trial: 是否来自于体验试用
    org_id: 报名老师所属组织ID  
